<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Presence 分享預覽圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Noto+Sans+KR:wght@500;900&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #eef3f6; color: #13233a; font-family: "Noto Sans KR", sans-serif; position: relative; }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 16px; font: 700 34px "Bricolage Grotesque", sans-serif; letter-spacing: -0.01em; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; }
  h1 { position: absolute; left: 72px; top: 178px; margin: 0; font-weight: 900; font-size: 92px; line-height: 1.12; letter-spacing: -0.035em; }
  html[lang="en"] h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 88px; letter-spacing: -0.045em; }
  html[lang="ko"] h1 { font-family: "Noto Sans KR", sans-serif; font-weight: 900; font-size: 88px; letter-spacing: -0.03em; }
  h1 span { display: block; }
  h1 .b { color: #2563d6; }
  p { position: absolute; left: 72px; bottom: 64px; margin: 0; font-size: 28px; font-weight: 500; color: #55657a; }
  /* 右邊：訊號越來越弱 */
  .rings { position: absolute; right: -150px; top: 70px; width: 560px; height: 560px; }
  .rings i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #1fae96; }
  .rings i:nth-child(2) { inset: 70px; opacity: 0.55; }
  .rings i:nth-child(3) { inset: 140px; opacity: 0.8; }
  .rings i:nth-child(1) { opacity: 0.25; }
  .rings b { position: absolute; inset: 225px; border-radius: 50%; background: #13233a; }
</style>
</head>
<body>
  <div class="rings"><i></i><i></i><i></i><b></b></div>
  <div class="brand"><img src="../assets/icon-512.png" alt="">Presence</div>
  <h1><span>떠나면 잠깁니다.</span><span class="b">돌아오면 열립니다.</span></h1>
  <p>Mac 자동 잠금. iPhone과 Apple Watch로 쓰는 프레젠테이션 리모컨.</p>
</body>
</html>
